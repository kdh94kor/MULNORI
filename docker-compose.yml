version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=3000
      - PEM_LOCATE=/usr/src/app/ap-southeast-2-bundle.pem
    volumes:
      - ./backend/ap-southeast-2-bundle.pem:/usr/src/app/ap-southeast-2-bundle.pem
    # depends_on:
    #   - db

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
